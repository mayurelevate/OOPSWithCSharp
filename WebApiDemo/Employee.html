<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="Scripts/jquery-3.4.1.js"></script>
    <script type="text/javascript">
        $(document).ready(function () {

            var ulEmployee = $("#ulEmployee");


            //Relative URL
            $("#btn").click(function () {

                var userName = $("#txtUserName").val();
                var password = $("#txtPassword").val();

                $.ajax({
                    type: "GET",
                    url: "https://localhost:44335/api/Employees",
                    ////fOR Enable CORS using JSONP : dataType: "jsonp", dataType: "jsonp",
                    dataType: "json",
                    headers: {
                        'Authorization': 'Basic ' + btoa(userName + ':' + password)
                    },
                    success: function (data) {
                        ulEmployee.empty();
                        $.each(data, function (index, val) {
                            var fullName = val.firstName + ' ' + val.lastName;
                            ulEmployee.append('<li>' + fullName + '(' + val.gender + ')</li > ');
                        });
                    },
                    complete: function (jqXHR) {
                        if (jqXHR.status == '401') {
                            ulEmployee.empty();
                            ulEmployee.append('<li style="color:red">' + jqXHR.status + ':' + jqXHR.statusText + '</li>');
                        }
                    }
                });
            });

            $("#btnClear").click(function () {
                ulEmployee.empty();
            });

        });
    </script>
</head>
<body>
    UserName : <input type="text" id="txtUserName" />
    Password : <input type="text" id="txtPassword" />
    <br />
    <br />
    <input id="btn" type="button" value="Authenticate And Get All Employee" />
    <input id="btnClear" type="button" value="Clear" />
    <ul id="ulEmployee"></ul>

</body>
</html>
